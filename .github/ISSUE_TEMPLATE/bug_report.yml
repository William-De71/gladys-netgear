name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste the password of your router: the logs of the integration do not contain it, but check before posting.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → NETGEAR, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: router
    attributes:
      label: Router model and firmware
      description: The model, the firmware and the port shown by "Test the connection". Say whether it is an Orbi with satellites, or a router in access point mode.
      placeholder: 'R7000, 1.0.11.134_10.2.120, port 5000'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Click **Diagnostic** in the configuration of the integration, then copy the lines starting with `NETGEAR diagnostic` from its Logs tab (serial number, MAC addresses, names, SSIDs and public IP are left out), with the lines around the problem. In developer mode only, `DEBUG=gladys-integration-sdk` adds the SDK debug logs.
      render: text
