<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the NETGEAR integration for Gladys Assistant (illustration,
       not the NETGEAR logo). Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110f1f"/>
      <stop offset="1" stop-color="#1c1836"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3550"/>
      <stop offset="1" stop-color="#17141f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>

  <!-- faint network grid -->
  <g stroke="#26213f" stroke-width="1">
    <path d="M0 89 H800 M0 178 H800 M0 267 H800 M0 356 H800 M0 445 H800"/>
    <path d="M100 0 V534 M200 0 V534 M300 0 V534 M400 0 V534 M500 0 V534 M600 0 V534 M700 0 V534"/>
  </g>

  <!-- internet globe, left -->
  <g transform="translate(110 170)" fill="none" stroke="#a5b4fc" stroke-width="5">
    <circle r="44" fill="#1d1b3a"/>
    <ellipse rx="18" ry="44"/>
    <path d="M-44 0 H44 M-38 -22 H38 M-38 22 H38"/>
  </g>
  <text x="110" y="245" fill="#a5b4fc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="middle">Internet</text>

  <!-- traffic bars, left bottom -->
  <g transform="translate(62 330)">
    <rect x="0" y="40" width="14" height="30" rx="3" fill="#38bdf8"/>
    <rect x="22" y="20" width="14" height="50" rx="3" fill="#38bdf8"/>
    <rect x="44" y="0" width="14" height="70" rx="3" fill="#8b5cf6"/>
    <rect x="66" y="28" width="14" height="42" rx="3" fill="#38bdf8"/>
    <rect x="88" y="10" width="14" height="60" rx="3" fill="#8b5cf6"/>
  </g>

  <!-- links -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M158 172 C 230 172, 250 250, 290 250" stroke="#a5b4fc"/>
    <path d="M512 236 C 575 236, 585 160, 640 160" stroke="#4ade80" stroke-dasharray="2 14"/>
    <path d="M512 268 C 575 268, 585 380, 640 380" stroke="#4ade80" stroke-dasharray="2 14"/>
  </g>

  <!-- the router: a wedge with angled antennas -->
  <circle cx="400" cy="240" r="170" fill="url(#glow)"/>
  <g stroke="#4b4566" stroke-width="12" stroke-linecap="round">
    <path d="M318 214 L290 118"/>
    <path d="M360 206 L350 96"/>
    <path d="M440 206 L450 96"/>
    <path d="M482 214 L510 118"/>
  </g>
  <path d="M290 214 L400 186 L510 214 L530 288 L270 288 Z" fill="url(#body)" stroke="#5b5478" stroke-width="3" stroke-linejoin="round"/>
  <path d="M310 262 L400 244 L490 262" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#4ade80">
    <circle cx="352" cy="274" r="4"/>
    <circle cx="370" cy="274" r="4"/>
    <circle cx="388" cy="274" r="4"/>
    <circle cx="406" cy="274" r="4" fill="#38bdf8"/>
    <circle cx="424" cy="274" r="4" fill="#8b5cf6"/>
  </g>
  <!-- Wi-Fi waves above -->
  <g fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round">
    <path d="M370 66 A42 42 0 0 1 430 66"/>
    <path d="M352 46 A68 68 0 0 1 448 46" stroke-opacity="0.7"/>
    <path d="M334 26 A94 94 0 0 1 466 26" stroke-opacity="0.4"/>
  </g>

  <!-- the home (Gladys), right top -->
  <g transform="translate(690 160)">
    <path d="M-44 4 L0 -36 L44 4" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-32" y="0" width="64" height="44" rx="6" fill="#163527" stroke="#4ade80" stroke-width="5"/>
    <rect x="-9" y="18" width="18" height="26" rx="3" fill="#4ade80"/>
  </g>
  <!-- phone and laptop on the network, right bottom -->
  <g transform="translate(690 380)" fill="#163527" stroke="#4ade80" stroke-width="5">
    <rect x="-46" y="-26" width="52" height="36" rx="5"/>
    <rect x="18" y="-34" width="28" height="50" rx="6"/>
    <path d="M-30 22 h20" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="400" y="400" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle">NETGEAR</text>
  <text x="400" y="446" fill="#d4d0ea" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" text-anchor="middle">for Gladys Assistant</text>
  <text x="400" y="490" fill="#8a85a8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" text-anchor="middle">Nighthawk and Orbi routers · presence, traffic, guest Wi-Fi</text>
</svg>
